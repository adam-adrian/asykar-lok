<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D9B65C"/>
      <stop offset="100%" stop-color="#98761F"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23473D"/>
      <stop offset="100%" stop-color="#16302A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle with Soft Outer Ring -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14" filter="url(#shadow)"/>
  
  <!-- Inner Decorative Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Star Embellishment Top & Bottom -->
  <polygon points="256,65 261,78 274,78 263,86 267,99 256,91 245,99 249,86 238,78 251,78" fill="url(#goldGrad)"/>
  <polygon points="256,415 261,428 274,428 263,436 267,449 256,441 245,449 249,436 238,428 251,428" fill="url(#goldGrad)"/>

  <!-- LK Monogram -->
  <text x="256" y="295" 
        font-family="'Fraunces', 'Georgia', serif" 
        font-size="190" 
        font-weight="700" 
        letter-spacing="2" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        dominant-baseline="central">LK</text>
</svg>